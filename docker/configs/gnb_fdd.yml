
cu_cp:
  amf:
    addr: 10.53.1.2
    port: 38412
    bind_addr: 10.53.1.3
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: uhd
  device_args: type=x4xx,addr=192.168.10.2,num_recv_frames=64,num_send_frames=64
  srate: 30.72                           # RF sample rate might need to be adjusted according to selected bandwidth.
  clock: internal
  otw_format: sc16
  tx_gain: 60                            # Transmit gain of the RF might need to adjusted to the given situation.
  rx_gain: 40                            # Receive gain of the RF might need to adjusted to the given situation.

cell_cfg:
  dl_arfcn: 373000                       # ARFCN of the downlink carrier (center frequency).
  band: 3                                # The NR band.
  channel_bandwidth_MHz: 20              # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 15                         # Subcarrier spacing in kHz used for data.
  plmn: "00101"                          # PLMN broadcasted by the gNB.
  tac: 7                                 # Tracking area code (needs to match the core configuration).
  pci: 1                                 # Physical cell ID.
  pdcch:
    dedicated:
      # === Define CORESET 1 geometry ===
      coreset1_rb_start: 29              # CRB index
      coreset1_l_crb: 48                 # CORESET1 spans 48 PRBs
      coreset1_duration: 2               # 2 OFDM symbols, FR1 standard

      # UE SearchSpace #2 using CORESET1
      ss2_n_candidates: [0, 0, 4, 0, 0]
      dci_format_0_1_and_1_1: false      # use fallback DCI 0_0 / 1_0
      ss2_type: ue_dedicated
  # pdcch:
  #   dedicated:
  #     ss2_type: common
  #     dci_format_0_1_and_1_1: false
  #   common:
  #     ss0_index: 0
  #     coreset0_index: 12
  # prach:
  #   prach_config_index: 1
  # pdsch:
  #   mcs_table: qam64
  # pusch:
  #   mcs_table: qam64

log:
  filename: /logs/gnb.log                # Path of the log file.
  all_level: debug                       # Logging level applied to all layers. 

pcap:
  mac_enable: true                       # Set to true to enable MAC-layer PCAPs.
  mac_filename: /logs/gnb_mac.pcap       # Path where the MAC PCAP is stored.

metrics:
  autostart_stdout_metrics: true
  enable_json: true

remote_control:
  bind_addr: 0.0.0.0
  enabled: true
